name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run format:check
      - run: bun test
      # CU-868khttg2: el gate incluye `build` en ambos repos. El bug que originó el
      # ticket estaba en macha-frontend, pero la causa de fondo era el hueco del gate,
      # no el bug: typecheck/lint/test no compilan el bundle de despliegue, y `main`
      # despliega solo. Aquí es barato (~200ms) y cubre el mismo riesgo.
      - run: bun run build
