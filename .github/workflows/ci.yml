name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    # Sin esto, un paso que se cuelga corre hasta el timeout por defecto del runner
    # (6 horas). Pasó de verdad con el job de integración (CU-868kh8zbj).
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run format:check
      # `bun run test`, NO `bun test`: el CLI crudo ignora el script de package.json y
      # barre TODO el repo, incluido tests/integration/, que necesita un Postgres que
      # este job no tiene. El script acota a `bun test src`. (CU-868kh8zbj)
      #
      # DATABASE_URL es de mentira y a propósito: `src/app.test.ts` monta la app entera
      # para fijar qué rutas son públicas y cuáles exigen token, y esa cadena de imports
      # pasa por `lib/env.ts`, que exige la variable al cargarse. Ninguna de esas pruebas
      # abre una conexión (postgres.js conecta perezosamente y las rutas guardadas cortan
      # en el guard), así que no hace falta un Postgres en este job — solo que la variable
      # exista. El job `integration` de abajo sí levanta uno real.
      - run: bun run test
        env:
          DATABASE_URL: postgres://unused:unused@127.0.0.1:1/unused
      # CU-868khttg2: el gate incluye `build` en ambos repos. El bug que originó el
      # ticket estaba en macha-frontend, pero la causa de fondo era el hueco del gate,
      # no el bug: typecheck/lint/test no compilan el bundle de despliegue, y `main`
      # despliega solo. Aquí es barato (~200ms) y cubre el mismo riesgo.
      - run: bun run build

  # `bun run build` de arriba NO construye la imagen, y la imagen es lo que Railway
  # despliega de verdad. El hueco no era teórico: el `prepare` de package.json es
  # `husky`, devDependency, así que `bun install --production` moría con
  # `husky: command not found` (exit 127) y la imagen NUNCA compiló — con el gate
  # entero en verde, porque nadie la construía. Se descubrió en el primer deploy real
  # a Railway, no aquí, que es exactamente lo que este job evita que se repita.
  #
  # Construye y además ARRANCA el contenedor: una imagen que compila pero no levanta
  # (falta un binario en la etapa runtime, un COPY que no trajo lo que hacía falta)
  # pasaría un build a secas. `pg_dump` se verifica aparte porque no lo usa el arranque
  # sino el job nocturno de backup — se rompería en silencio meses después.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t macha-backend:ci .
      - name: El contenedor arranca y responde
        run: |
          docker run -d --name ci-smoke -p 3001:3001 \
            -e DATABASE_URL='postgres://unused:unused@127.0.0.1:1/unused' \
            macha-backend:ci
          for i in $(seq 1 30); do
            if curl -sf -m 2 http://localhost:3001/health; then echo "OK"; exit 0; fi
            sleep 1
          done
          echo "El contenedor no respondió en /health:"
          docker logs ci-smoke
          exit 1
      - name: pg_dump existe en la imagen (job nocturno de backup, CU-868kfvar3)
        run: docker run --rm --entrypoint pg_dump macha-backend:ci --version

  # CU-868kh8zbj criterio 5: los tests de integración corren EN CI o no protegen nada.
  # Job aparte del unitario a propósito: necesita un Postgres y tarda más, y separarlo
  # deja ver de un vistazo si lo que se rompió fue el aislamiento o el código normal.
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      # El servicio nativo de Actions en vez de docker-compose.test.yml: mismo
      # Postgres 16, sin gastar tiempo levantando compose dentro del runner. El
      # compose existe para correr lo mismo en local.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: macha_owner
          POSTGRES_PASSWORD: macha_test
          POSTGRES_DB: macha_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U macha_owner -d macha_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      # El runner aplica las migraciones como dueño, crea macha_app y las re-aplica
      # para activar el GRANT/REVOKE de 0010 — el mismo orden que el despliegue real.
      # tests/integration/preconditions.test.ts falla si el rol de la app resultara
      # ser el dueño (criterio 6): sin esa precondición, RLS y append-only son no-ops
      # y el resto de la suite daría verdes falsos.
      - run: bun run test:integration
        env:
          TEST_DATABASE_URL: postgres://macha_owner:macha_test@localhost:55432/macha_test
